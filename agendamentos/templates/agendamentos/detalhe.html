{% extends 'agendamentos/base.html' %}

{% block conteudo %}
  <h2>{{ agendamento.nome }}</h2>
  <p><strong>Contato:</strong> {{ agendamento.contato }}</p>
  <p><strong>Data:</strong> {{ agendamento.data|date:"d/m/Y" }}</p>
  <p><strong>Serviço:</strong> {{ agendamento.servico }}</p>

  <!-- Navegação: usar link -->
  <a class="botao" href="{% url 'agendamentos:editar' agendamento.id %}">Editar</a>
  <a class="botao cinza" href="{% url 'agendamentos:lista' %}">Voltar</a>

  <!-- Ação: usar formulário POST -->
  <form method="post" action="{% url 'agendamentos:excluir' agendamento.id %}"
        style="display:inline" onsubmit="return confirm('Deseja excluir este agendamento?')">
    {% csrf_token %}
    <button type="submit" class="vermelho">Excluir</button>
  </form>
{% endblock %}
